[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-gateway"
version = "1.0.0"
description = "HTTP/JSON-RPC reverse proxy that authenticates callers and authorises MCP tool calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "mcp>=2.0,<3",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# The mock server is a test and demo fixture; it is not shipped in distributions.
exclude = ["mock_*", "mock_*.*"]
